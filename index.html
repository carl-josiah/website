<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>website</title>
  </head>

  <style>
html, body {
  margin: 0;
  padding: 0;
}

body {
  background-color: black;
  text-align: center;
}

h1 {
  color: white;
  font-size: 100px;
}

.dead-center {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.bottom-center {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 100vh;
  margin: 0;
}

.hover-swap .alt {
  display: none;
}

.hover-swap:hover .default {
  display: none;
}

.hover-swap:hover .alt {
  display: inline;
}
  </style>

  <body>
    <div class="dead-center">
      <h1 class="hover-swap">
        <span class="default" style="color: red;">
          love<span style="color:white;font-size:30px">blinds</span><span style="color:red;font-size:100px">.</span>
        </span>
        <span class="alt" style="color: white;">
          fear<span style="color:red;font-size:30px">binds</span><span style="color:white;font-size:100px">.</span>
        </span>
      </h1>
    </div>
    <a href="idea.html" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
      <span style="color:white;">idea</span>
    </a>
  </body>
</html>
