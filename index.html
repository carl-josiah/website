<!DOCTYPE html>
<!--
  a jumbled mess. i just have to let it out.

  i thought that i should have my own personal website by now to serve as an extension of me
  (who i am, my interests, dislikes, thoughts) rather than just a showcase for personal
  projects. here you will uncover my thoughts, not only in tech but the world in general.

  if you ask me, why not substack or any other major social media network so i could
  have that reach. that's the point, i don't want that reach. i want this website to
  be stumbled upon as an accident.

  i want to make you think. i realized that if keep my thoughts to myself it's as good
  as never having thought of them in the first place. so that's why i have to let it out,
  particularly as a way to vent? or maybe it's just human nature to share whether it be
  knowledge, perspective, or wisdom. i cannot keep my thoughts in an isolated vacuum any
  longer.

  another thing is that, i'd rather have the thoughts generate momentum upon another person.
  rather than have these thoughts, keep it as a way to embody.

  free from the algorithm, free from superficial feedbacks that i dislike from social media.
  i would rather influence a person without me knowing that i did.
  people i like who are into tech: casey muratori, tokyospliff, hayyoth, james scholz,
  george hotz.
-->
